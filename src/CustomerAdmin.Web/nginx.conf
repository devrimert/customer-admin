server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same idea as the Vite proxy: the browser talks to one address, so no CORS
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a hash in these file names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router handles the URLs, e.g. /customers/5 has no file on disk
    location / {
        try_files $uri /index.html;
    }
}
